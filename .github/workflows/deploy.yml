# Deploys NcsScheduler to the production Ubuntu server over Tailscale.
#
# Trigger: publishing a GitHub Release.
#
# Required repo secrets (see docs/deployment.md for setup):
#   TS_OAUTH_CLIENT_ID  - Tailscale OAuth client ID (tag:ci)
#   TS_OAUTH_SECRET     - Tailscale OAuth client secret
#   SSH_PRIVATE_KEY     - private half of the deploy keypair
#   DEPLOY_HOST         - server's Tailscale hostname/IP (e.g. ncs-server.tailnet.ts.net)
#   DEPLOY_USER         - SSH user on the server (e.g. deploy)

name: Deploy

on:
  release:
    types: [published]

env:
  DEPLOY_PATH: /opt/ncsscheduler
  SERVICE_NAME: ncsscheduler
  # Must match ASPNETCORE_URLS in the systemd unit -- 5106 is only the
  # dev-time port from launchSettings.json, which doesn't apply when
  # systemd runs the published DLL directly instead of `dotnet run`.
  APP_PORT: 5000

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish NcsScheduler/NcsScheduler.csproj -c Release -o publish -p:InformationalVersion=${{ github.event.release.tag_name }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup database
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo cp '$DEPLOY_PATH/ncsscheduler.db' '$DEPLOY_PATH/ncsscheduler.db.bak-\$(date +%Y%m%d%H%M%S)'"

      - name: Stop service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl stop $SERVICE_NAME"

      - name: Sync files
        run: |
          # deploy isn't the owner of the existing www-data-owned files,
          # so it can't reliably delete/overwrite/chown/chmod them as
          # itself. --rsync-path runs the remote-side rsync as root
          # (via a narrowly-scoped NOPASSWD sudo rule) so it can freely
          # write, delete, and set final ownership via --chown.
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            --chown=www-data:www-data \
            --exclude 'appsettings.json' \
            --exclude 'appsettings.Development.json' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '*.bak-*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/"

      - name: Start service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl start $SERVICE_NAME"

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$APP_PORT/)
              if [ \"\$code\" != \"000\" ]; then
                echo \"App responded with HTTP \$code\"
                exit 0
              fi
              sleep 3
            done
            echo 'App failed to respond within 90s; recent logs:'
            sudo journalctl -u $SERVICE_NAME -n 50 --no-pager
            exit 1
          "
